[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockml"
version = "0.1.0"
description = "Production-grade FastAPI backend for stock market machine learning workflows."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Bhuvan K" }]
keywords = ["stocks", "machine-learning", "fastapi", "backend"]
dependencies = [
    "fastapi>=0.136.0,<1.0.0",
    "numpy>=2.1.0,<3.0.0",
    "pandas>=2.3.0,<3.0.0",
    "pydantic>=2.13.0,<3.0.0",
    "pydantic-settings>=2.14.0,<3.0.0",
    "python-dotenv>=1.2.0,<2.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "uvicorn[standard]>=0.48.0,<1.0.0",
    "yfinance>=0.2.65,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=2.1.0,<3.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.15.0,<1.0.0",
]

[tool.setuptools]
include-package-data = false
packages = [
    "app",
    "app.api",
    "app.api.v1",
    "app.api.v1.endpoints",
    "stockml",
    "stockml.core",
    "stockml.domain",
    "stockml.domain.models",
    "stockml.domain.protocols",
    "stockml.infrastructure",
    "stockml.infrastructure.market_data",
    "stockml.infrastructure.news",
    "stockml.ml",
    "stockml.schemas",
    "stockml.services",
]

[tool.setuptools.package-dir]
app = "app"
"app.api" = "app/api"
"app.api.v1" = "app/api/v1"
"app.api.v1.endpoints" = "app/api/v1/endpoints"
stockml = "src/stockml"
"stockml.core" = "src/stockml/core"
"stockml.domain" = "src/stockml/domain"
"stockml.domain.models" = "src/stockml/domain/models"
"stockml.domain.protocols" = "src/stockml/domain/protocols"
"stockml.infrastructure" = "src/stockml/infrastructure"
"stockml.infrastructure.market_data" = "src/stockml/infrastructure/market_data"
"stockml.infrastructure.news" = "src/stockml/infrastructure/news"
"stockml.ml" = "src/stockml/ml"
"stockml.schemas" = "src/stockml/schemas"
"stockml.services" = "src/stockml/services"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src", "app"]
mypy_path = ["src", "."]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "sklearn", "sklearn.*", "yfinance"]
ignore_missing_imports = true
